name: frr-rip
topology:
  nodes:
    R1:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - R1/daemons:/etc/frr/daemons
        - R1/frr.conf:/etc/frr/frr.conf
    R2:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - R2/daemons:/etc/frr/daemons
        - R2/frr.conf:/etc/frr/frr.conf
    R3:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - R3/daemons:/etc/frr/daemons
        - R3/frr.conf:/etc/frr/frr.conf
    R4:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - R4/daemons:/etc/frr/daemons
        - R4/frr.conf:/etc/frr/frr.conf
    R5:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - R5/daemons:/etc/frr/daemons
        - R5/frr.conf:/etc/frr/frr.conf
    R6:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - R6/daemons:/etc/frr/daemons
        - R6/frr.conf:/etc/frr/frr.conf
    H1:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route replace default via 192.168.1.1
    H2:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.2.10/24 dev eth1
        - ip route replace default via 192.168.2.1
  links:
    - endpoints: ["R1:eth1", "R2:eth1"]
    - endpoints: ["R2:eth2", "R3:eth1"]
    - endpoints: ["R1:eth2", "R4:eth1"]
    - endpoints: ["R2:eth3", "R5:eth1"]
    - endpoints: ["R3:eth2", "R6:eth1"]
    - endpoints: ["R4:eth2", "R5:eth2"]
    - endpoints: ["R5:eth3", "R6:eth2"]
    - endpoints: ["R1:eth3", "H1:eth1"]
    - endpoints: ["R3:eth3", "H2:eth1"]
