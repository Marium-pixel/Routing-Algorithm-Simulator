hostname R2
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 ip address 10.0.0.2/30
!
interface eth2
 ip address 10.0.0.5/30
!
interface eth3
 ip address 10.0.0.13/30
!
router rip
 version 2
 timers basic 30 180 120
 network 10.0.0.0/8
 passive-interface lo
!
line vty
!
